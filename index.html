<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#151b2d"><title>GymRob</title><link rel="stylesheet" href="style.css"></head>
<body><div id="game"></div>
<div id="hud"><div class="brand">GYM<span>ROB</span></div><div class="stats"><div>💪 Сила: <b id="strength">1</b></div><div>⚡ Скорость: <b id="speed">1</b></div><div>🪙 Монеты: <b id="coins">500</b></div></div><button id="menuBtn">МЕНЮ</button></div>
<div id="hint">WASD — движение · мышь — обзор · E — взаимодействие</div>
<div id="crosshair">+</div>
<div id="panel" class="hidden"><button class="close" id="closePanel">✕</button><h2 id="panelTitle">Зона</h2><p id="panelDesc"></p><div id="panelActions"></div></div>
<div id="toast"></div>
<div id="mobile"><div id="stick"><div id="stickKnob"></div></div><button id="actionBtn">ДЕЙСТВИЕ</button></div>
<div id="start"><div class="start-card"><h1>GYMROB</h1><p>Тренируйся. Становись сильнее. Собирай питомцев.</p><button id="play">ИГРАТЬ</button><small>На компьютере: WASD + мышь · На телефоне: джойстик</small></div></div>
<script type="module" src="game.js"></script></body></html>
